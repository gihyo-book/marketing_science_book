[project]
name = "marketing-science-src"
version = "0.1.0"
description = "Notebook environment for marketing science examples (chapters 01-10, 12)"
readme = "../../README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dataframe-image>=0.2.7",
    "graphviz>=0.21",
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
    "lifelines>=0.30.0",
    "lifetimes>=0.11.3",
    "lightgbm>=4.6.0",
    "loguru>=0.7.3",
    "matplotlib",
    "matplotlib-fontja>=1.1.0",
    "mlxtend>=0.24.0",
    "numpy",
    "pandas>=3.0.2",
    "papermill>=2.7.0",
    "polars",
    "prophet>=1.3.0",
    "pyarrow>=23.0.1",
    "pymc>=5.28.5",
    "scikit-learn",
    "statsmodels>=0.14.6",
    "torch>=2.11.0",
    "watermark>=2.6.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

