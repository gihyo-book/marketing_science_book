[project]
name = "marketing-science-src"
version = "0.1.0"
description = "Python 3.14 environment for all marketing science examples"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "arviz>=1.2,<2",
    "dataframe-image>=0.2.7",
    "graphviz>=0.21",
    "implicit>=0.7.3,<0.8",
    "ipykernel",
    "ipython",
    "ipywidgets",
    "jupyterlab",
    "lifelines>=0.30.0",
    "lifetimes>=0.11.3",
    "lightgbm>=4.6.0",
    "loguru>=0.7.3",
    "matplotlib",
    "matplotlib-fontja>=1.1.0",
    "mlxtend>=0.24.0",
    "numpy>=2,<2.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "papermill>=2.7.0",
    "pillow",
    "polars",
    "prophet>=1.3.0",
    "pyarrow>=23.0.1",
    "pymc>=6.2,<6.3",
    "pymc-extras>=0.14,<0.15",
    "pymc-marketing>=1.1,<1.2",
    "pyyaml",
    "scikit-learn",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "torch>=2.11.0",
    "threadpoolctl",
    "tqdm",
    "watermark>=2.6.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.16.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
