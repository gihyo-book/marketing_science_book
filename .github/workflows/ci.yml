name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.6"
          python-version: "3.14.4"

      - name: Run ruff check
        run: uv run --locked ruff check .

  notebooks-main:
    name: "Notebook ch${{ matrix.chapter }} (Python 3.14)"
    needs: lint
    runs-on: ubuntu-latest
    env:
      IPYTHONDIR: ${{ github.workspace }}/.ipython-ci
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    strategy:
      fail-fast: false
      matrix:
        chapter: ["00", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.6"
          python-version: "3.14.4"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ graphviz libgomp1

      - name: Install dependencies
        run: uv sync --locked

      - name: Prepare Online Retail dataset
        if: matrix.chapter == '02' || matrix.chapter == '11' || matrix.chapter == '12'
        run: |
          archive_file="${RUNNER_TEMP}/online-retail.zip"
          workbook_file="${RUNNER_TEMP}/online-retail.xlsx"
          mkdir -p 02/data
          curl --fail --location --retry 3 \
            "https://archive.ics.uci.edu/static/public/352/online+retail.zip" \
            --output "${archive_file}"
          unzip -p "${archive_file}" "Online Retail.xlsx" > "${workbook_file}"
          uv run --locked python -c \
            'import pandas as pd, sys; frame = pd.read_excel(sys.argv[1]); frame["CustomerID"] = frame["CustomerID"].astype("Int64"); frame.to_csv(sys.argv[2], index=False)' \
            "${workbook_file}" 02/data/online_retail.csv.gz
          test -s 02/data/online_retail.csv.gz

      - name: Prepare chapter 7 dataset
        if: matrix.chapter == '07'
        run: |
          mkdir -p 07/data
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv" \
            --output 07/data/Telco-Customer-Churn.csv
          test -s 07/data/Telco-Customer-Churn.csv

      - name: Prepare chapter 8 dataset
        if: matrix.chapter == '08'
        run: |
          archive_path="${RUNNER_TEMP}/groceries.zip"
          mkdir -p 08/data
          curl --fail --location --retry 3 \
            "https://www.kaggle.com/api/v1/datasets/download/rashikrahmanpritom/groceries-dataset-for-market-basket-analysismba" \
            --output "${archive_path}"
          unzip -oq "${archive_path}" -d 08/data
          test -f "08/data/Groceries data.csv"

      - name: Execute notebooks with pytest
        env:
          NOTEBOOK_CHAPTER: ${{ matrix.chapter }}
        run: uv run --locked pytest -q tests --basetemp .pytest-notebooks

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "executed-notebook-ch${{ matrix.chapter }}"
          path: .pytest-notebooks/**/*.ipynb
          if-no-files-found: ignore
